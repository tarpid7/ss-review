<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Review</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<!--
  Shell for the phone review page. Copied into the site repo by bin/ss-review-page.py: edit it in bin/, not in the repo.
  This file is public, so it holds no names, no captions and no addresses. Everything it shows is read from
  d/index.bin, which is sealed. The key arrives as #k=... in the link and is kept in this browser only.
-->
<style>
  :root {
    --bg: #F4F1EC;
    --card: #FFFFFF;
    --ink: #17181A;
    --muted: #625D56;
    --line: #E0DAD0;
    --well: #F7F5F1;
    --accent: #C4202A;
    --accent-ink: #FFFFFF;
    --yes: #1F7A4C;
    --yes-bg: #E3F2E9;
    --change: #8A5A00;
    --change-bg: #FBEFD2;
    --no: #9B1C24;
    --no-bg: #F8E1E2;
    --chip-ai: #5B3FA8;
    --chip-ai-bg: #ECE7F8;
    --shadow: 0 1px 2px rgba(23, 24, 26, 0.06), 0 6px 20px rgba(23, 24, 26, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121315;
      --card: #1B1D20;
      --ink: #F2EEE8;
      --muted: #A8A29A;
      --line: #2F3237;
      --well: #23262A;
      --accent: #EE5058;
      --accent-ink: #17181A;
      --yes: #6FD19C;
      --yes-bg: #173426;
      --change: #F0C060;
      --change-bg: #3A2D10;
      --no: #F28A90;
      --no-bg: #3B181B;
      --chip-ai: #BBA6F5;
      --chip-ai-bg: #2A2342;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-top: calc(28px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  h1, h2, .num, .kicker, .week {
    font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  }
  .kicker {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 6px;
    overflow-wrap: anywhere;
  }
  h1 {
    font-size: 40px;
    line-height: 1.02;
    font-weight: 700;
    margin: 0 0 12px;
    text-wrap: balance;
  }
  .lede { margin: 0; color: var(--muted); max-width: 46ch; }
  .lede strong { color: var(--ink); font-weight: 600; }
  .progress {
    margin-top: 16px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 15px;
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
  }
  .progress .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

  .week {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 8px 0 -8px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .week::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .post {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .post-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
  .num {
    flex: none;
    width: 44px;
    height: 44px;
    border-radius: 8px;
    background: var(--ink);
    color: var(--bg);
    font-size: 28px;
    font-weight: 700;
    display: grid;
    place-items: center;
    line-height: 1;
  }
  .when { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .when strong { font-size: 17px; font-weight: 600; line-height: 1.2; }
  .when span { font-size: 14px; color: var(--muted); }
  .chip {
    flex: none;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 4px 8px;
    border-radius: 6px;
    white-space: nowrap;
  }
  .chip.real { color: var(--yes); background: var(--yes-bg); }
  .chip.ai { color: var(--chip-ai); background: var(--chip-ai-bg); }

  .strip {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    background: var(--well);
  }
  .strip::-webkit-scrollbar { display: none; }
  .strip figure {
    flex: 0 0 100%;
    margin: 0;
    scroll-snap-align: start;
    aspect-ratio: 4 / 5;
    max-width: 100%;
  }
  .strip img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .strip img:not([src]) { visibility: hidden; }
  .count {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    margin: 0;
    padding: 8px 16px 0;
    font-variant-numeric: tabular-nums;
  }

  .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 16px; }
  .label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 6px;
  }
  .cap-block { display: flex; flex-direction: column; }
  .cap-text { white-space: pre-line; margin: 0; overflow-wrap: anywhere; }
  .checks {
    background: var(--well);
    border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0;
    padding: 12px 14px;
  }
  .checks p:last-child { margin: 0; font-size: 15px; overflow-wrap: anywhere; }
  .notice {
    margin: 0;
    background: var(--change-bg);
    color: var(--change);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 15px;
    font-weight: 500;
    overflow-wrap: anywhere;
  }

  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, textarea:focus-visible, .strip:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .copy {
    align-self: flex-start;
    margin-top: 10px;
    font-size: 14px;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: transparent;
  }
  .cap-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .cap-edit { min-height: 200px; }
  .cap-note { margin: 10px 0 0; font-size: 14px; font-weight: 600; color: var(--change); }
  .cap-note.bad { color: var(--no); }
  .decide { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .decide button {
    min-height: 48px;
    font-size: 17px;
    font-weight: 600;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: transparent;
  }
  .decide button[aria-pressed="true"][data-v="yes"] { background: var(--yes-bg); color: var(--yes); border-color: var(--yes); }
  .decide button[aria-pressed="true"][data-v="change"] { background: var(--change-bg); color: var(--change); border-color: var(--change); }
  .decide button[aria-pressed="true"][data-v="no"] { background: var(--no-bg); color: var(--no); border-color: var(--no); }
  textarea {
    width: 100%;
    min-height: 72px;
    font: inherit;
    color: var(--ink);
    background: var(--well);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    resize: vertical;
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .panel h2 { font-size: 26px; font-weight: 700; line-height: 1.1; margin: 0; }
  .panel p { margin: 0; color: var(--muted); }
  #answers {
    margin: 0;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 15px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    background: var(--well);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    min-height: 48px;
  }
  .primary {
    min-height: 48px;
    font-size: 17px;
    font-weight: 600;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
  }
  .primary:disabled { opacity: 0.45; cursor: default; }
  .secondary {
    min-height: 44px;
    font-size: 16px;
    font-weight: 600;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: transparent;
    color: var(--ink);
  }
  a.secondary { display: flex; align-items: center; justify-content: center; text-decoration: none; }
  .panel p.sent { color: var(--yes); font-weight: 600; }
  .panel p.warn { color: var(--no); font-weight: 600; }
  .panel .small { font-size: 14px; }
  .list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
  .list span { color: var(--muted); }
  .foot { font-size: 14px; color: var(--muted); margin: 0; }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="lede">Loading.</p></div>

<script>
(function () {
  var app = document.getElementById("app");
  var KEY_STORE = "review-key";
  var STATE_STORE = "review-answers";
  var SENT_STORE = "review-sent";

  function get(k, fallback) {
    try { var v = JSON.parse(localStorage.getItem(k)); return v === null ? fallback : v; } catch (e) { return fallback; }
  }
  function put(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function drop(k) { try { localStorage.removeItem(k); } catch (e) {} }

  // Builds one element. Text only ever goes in as text, never as markup.
  function el(tag, attrs, kids) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "text") node.textContent = attrs[k];
      else if (k === "hidden") node.hidden = !!attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (kid) { if (kid) node.appendChild(kid); });
    return node;
  }
  function plain(title, text) {
    app.replaceChildren(el("header", {}, [el("h1", { text: title }), el("p", { class: "lede", text: text })]));
  }

  var fromLink = /(?:^#|&)k=([A-Za-z0-9_-]{43})(?:&|$)/.exec(location.hash);
  var keyText = fromLink ? fromLink[1] : get(KEY_STORE, null);
  if (!keyText || !window.crypto || !crypto.subtle) {
    plain("Nothing to show here", "Open this page from the link in your notification.");
    return;
  }

  function bytes(b64u) {
    var s = b64u.replace(/-/g, "+").replace(/_/g, "/");
    var bin = atob(s + "===".slice((s.length + 3) % 4));
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  var cryptoKey = crypto.subtle.importKey("raw", bytes(keyText), "AES-GCM", false, ["decrypt"]);

  // A sealed file is a 12 byte IV followed by the AES-GCM ciphertext and tag.
  function unseal(path, fresh) {
    return fetch(path, fresh ? { cache: "no-store" } : {}).then(function (r) {
      if (!r.ok) throw new Error("fetch");
      return r.arrayBuffer();
    }, function () { throw new Error("fetch"); }).then(function (buf) {
      return cryptoKey.then(function (k) {
        return crypto.subtle.decrypt({ name: "AES-GCM", iv: new Uint8Array(buf, 0, 12) }, k, new Uint8Array(buf, 12));
      }).catch(function () { throw new Error("key"); });
    });
  }

  var data = null;       // the unsealed payload
  var lastText = null;   // its JSON text, to spot a new build
  var lastLoad = 0;
  var posts = [];        // [{id, digest, post, node}]
  var state = get(STATE_STORE, {}) || {};
  var sent = get(SENT_STORE, null);
  var pictures = {};     // sealed file name -> promise of a blob URL
  var ui = {};

  // Photos load a few at a time, in page order.
  var queue = [], busy = 0;
  function pump() {
    while (busy < 3 && queue.length) {
      busy += 1;
      queue.shift()().then(function () { busy -= 1; pump(); });
    }
  }
  function picture(name) {
    if (!pictures[name]) {
      pictures[name] = new Promise(function (resolve) {
        queue.push(function () {
          return unseal("d/" + name, false).then(function (buf) {
            resolve(URL.createObjectURL(new Blob([buf], { type: "image/jpeg" })));
          }, function () { delete pictures[name]; resolve(null); });
        });
        pump();
      });
    }
    return pictures[name];
  }

  // One message to the shop computer has to stay well under 4096 bytes, so a long batch goes as several.
  var MAX_MESSAGE = 3600, MAX_CAPTION = 3300;
  function size(text) { return new TextEncoder().encode(text).length; }
  // A caption as typed: plain line breaks, no trailing spaces, no more than one blank line in a row.
  function tidy(text) {
    return String(text || "").replace(/\r\n?|[\u0085\u2028\u2029]/g, "\n").replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
  }
  // The viewer's own wording for a post, or "" when the caption is as the shop computer wrote it.
  function edited(p) {
    var s = state[p.id];
    var cap = s && s.cap ? tidy(s.cap) : "";
    return cap && cap !== tidy(p.post.caption) ? cap : "";
  }
  function capLine(p) {
    var cap = edited(p);
    return cap ? p.post.n + " caption " + JSON.stringify(cap) : "";
  }
  function tooLong(p) { return size(capLine(p)) > MAX_CAPTION; }
  // Saves one post's answer and edit together; an entry with neither is dropped.
  function store(p, change) {
    var old = state[p.id] || {};
    var s = { rev: p.post.rev, v: old.v, note: old.note || "", cap: old.cap };
    Object.keys(change).forEach(function (k) { s[k] = change[k]; });
    if (!s.v) { delete s.v; delete s.note; }
    if (!s.cap) delete s.cap;
    if (s.v || s.cap) state[p.id] = s; else delete state[p.id];
    put(STATE_STORE, state);
  }

  // What goes to the shop computer: [{digest, line, show}], a caption line before the answer for the same post.
  function wire() {
    var out = [];
    posts.forEach(function (p) {
      var s = state[p.id];
      if (!s) return;
      var cap = capLine(p);
      if (cap && !tooLong(p)) out.push({ digest: p.digest, line: cap, show: p.post.n + " caption edited" });
      if (!s.v) return;
      var line = p.post.n + " " + s.v;
      var note = (s.note || "").replace(/\s+/g, " ").trim();
      if (s.v === "change" && note) line += ": " + note;
      out.push({ digest: p.digest, line: line, show: line });
    });
    return out;
  }
  function messages() {
    var out = [], cur = "", digest = null;
    wire().forEach(function (w) {
      var head = "digest " + w.digest;
      if (cur && size(cur + "\n" + head + "\n" + w.line) > MAX_MESSAGE) { out.push(cur); cur = ""; digest = null; }
      if (w.digest !== digest) { digest = w.digest; cur += (cur ? "\n" : "") + head; }
      cur += "\n" + w.line;
    });
    if (cur) out.push(cur);
    return out;
  }
  function messageText() { return messages().join("\n"); }
  function previewText() {
    var lines = [], digest = null;
    wire().forEach(function (w) {
      if (w.digest !== digest) { digest = w.digest; lines.push("digest " + digest); }
      lines.push(w.show);
    });
    return lines.join("\n");
  }

  function refresh() {
    var done = 0;
    posts.forEach(function (p) {
      var s = state[p.id] || {};
      if (s.v) done += 1;
      p.node.querySelectorAll(".decide button").forEach(function (b) {
        b.setAttribute("aria-pressed", String(b.getAttribute("data-v") === s.v));
      });
      var note = p.node.querySelector(".note");
      note.hidden = s.v !== "change";
      if (document.activeElement !== note && note.value !== (s.note || "")) note.value = s.note || "";
      var cap = edited(p), long = !!cap && tooLong(p);
      p.node.querySelector(".cap-text").textContent = cap || p.post.caption;
      p.node.querySelector(".cap-undo").hidden = !cap;
      var capNote = p.node.querySelector(".cap-note");
      capNote.hidden = !cap;
      capNote.className = "cap-note" + (long ? " bad" : "");
      capNote.textContent = long ? "This caption is too long to send. Shorten it." : "Your wording. It is saved when you tap Send answers.";
    });
    if (!posts.length) return;
    var text = messageText();
    ui.progress.textContent = done + " of " + posts.length + " answered";
    ui.answers.textContent = previewText() || "No answers yet.";
    ui.send.disabled = !text || ui.sending;
    ui.status.className = "sent";
    if (ui.sending) {
      ui.send.textContent = "Sending";
    } else if (text && sent && sent.text === text) {
      ui.send.textContent = "Send again";
      ui.status.hidden = false;
      ui.status.textContent = "Sent " + sent.at + ". A push confirms it within a few minutes.";
    } else if (text && sent) {
      ui.send.textContent = "Send answers";
      ui.status.hidden = false;
      ui.status.textContent = "Your answers changed since you sent at " + sent.at + ". Tap Send answers again.";
    } else {
      ui.send.textContent = "Send answers";
      ui.status.hidden = true;
    }
  }

  function send() {
    var parts = messages(), text = parts.join("\n");
    if (!text || ui.sending) return;
    ui.sending = true;
    ui.fallback.hidden = true;
    refresh();
    // One after the other, in order: a caption edit has to land before the yes for the same post.
    parts.reduce(function (before, body) {
      return before.then(function () {
        return fetch("https://ntfy.sh/" + data.topic, { method: "POST", body: body });
      }).then(function (r) { if (!r.ok) throw new Error("send"); });
    }, Promise.resolve()).then(function () {
      sent = { text: text, at: new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) };
      put(SENT_STORE, sent);
      ui.sending = false;
      refresh();
    }).catch(function () {
      ui.sending = false;
      refresh();
      // A link can only carry a short message, so an edited caption has no link to fall back on.
      var short = parts.length === 1 && text.length <= 1200;
      ui.status.hidden = false;
      ui.status.className = "warn";
      ui.status.textContent = "That did not go through. Check your signal and try again" + (short ? ", or use the link below." : ".");
      if (short) {
        ui.fallback.setAttribute("href", "https://ntfy.sh/" + data.topic + "/publish?message=" + encodeURIComponent(text));
        ui.fallback.hidden = false;
      }
    });
  }

  // Copies source's text, or the given text when the box shows something shorter than what is sent.
  function copyFrom(source, btn, label, text) {
    function ok() { btn.textContent = "Copied"; setTimeout(function () { btn.textContent = label; }, 1600); }
    function fail() {
      try {
        if (text != null) source.textContent = text;
        var r = document.createRange();
        r.selectNodeContents(source);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(r);
      } catch (e) {}
      btn.textContent = "Selected. Press copy.";
      setTimeout(function () { btn.textContent = label; }, 3000);
    }
    try { navigator.clipboard.writeText(text != null ? text : source.textContent).then(ok, fail); } catch (e) { fail(); }
  }

  function postCard(p, manyBatches) {
    var post = p.post, total = post.slides.length;
    var strip = el("div", { class: "strip", "aria-label": (total > 1 ? "Slides" : "Photo") + " for post " + post.n });
    if (total > 1) strip.setAttribute("tabindex", "0");
    post.slides.forEach(function (slide) {
      var img = el("img", { width: "1080", height: "1350", alt: slide.alt || "" });
      strip.appendChild(el("figure", {}, [img]));
      picture(slide.f).then(function (url) { if (url) img.src = url; });
    });
    var cur = el("span", { text: "1" });
    strip.addEventListener("scroll", function () {
      cur.textContent = String(Math.round(strip.scrollLeft / Math.max(1, strip.clientWidth)) + 1);
    }, { passive: true });

    var caption = el("p", { class: "cap-text", text: post.caption });
    var copy = el("button", { class: "copy", type: "button", text: "Copy caption" });
    copy.addEventListener("click", function () { copyFrom(caption, copy, "Copy caption"); });

    // Edit caption swaps the text for a box. What is typed there is the caption, word for word.
    var editor = el("textarea", { class: "cap-edit", hidden: true, maxlength: "2200", "aria-label": "Caption for post " + post.n });
    var edit = el("button", { class: "copy", type: "button", "aria-expanded": "false", text: "Edit caption" });
    var undo = el("button", { class: "copy cap-undo", type: "button", hidden: true, text: "Undo my edit" });
    function editing(on) {
      if (on) editor.value = edited(p) || post.caption;
      editor.hidden = !on;
      caption.hidden = on;
      edit.textContent = on ? "Done" : "Edit caption";
      edit.setAttribute("aria-expanded", String(on));
      if (on) editor.focus();
    }
    edit.addEventListener("click", function () { editing(editor.hidden); });
    editor.addEventListener("input", function () {
      store(p, { cap: tidy(editor.value) === tidy(post.caption) ? "" : editor.value });
      refresh();
    });
    undo.addEventListener("click", function () {
      store(p, { cap: "" });
      editing(false);
      refresh();
    });

    var note = el("textarea", { class: "note", hidden: true, maxlength: "500", "aria-label": "What should change on post " + post.n, placeholder: "What should change?" });
    note.addEventListener("input", function () {
      store(p, { v: "change", note: note.value });
      refresh();
    });
    var decide = el("div", { class: "decide", role: "group", "aria-label": "Decision for post " + post.n });
    [["yes", "Yes"], ["change", "Change"], ["no", "No"]].forEach(function (pair) {
      var b = el("button", { type: "button", "data-v": pair[0], "aria-pressed": "false", text: pair[1] });
      b.addEventListener("click", function () {
        var old = state[p.id] || {};
        store(p, { v: old.v === pair[0] ? "" : pair[0] });
        refresh();
        if (state[p.id] && state[p.id].v === "change") note.focus();
      });
      decide.appendChild(b);
    });

    var chip = post.ai ? "AI-made cards" : (total > 1 ? "Real photos" : "Real photo");
    var kind = post.kind + (manyBatches ? ", sent " + p.sent : "");
    return el("article", { class: "post" }, [
      el("div", { class: "post-head" }, [
        el("span", { class: "num", text: post.n }),
        el("div", { class: "when" }, [el("strong", { text: post.when }), el("span", { text: kind })]),
        el("span", { class: "chip " + (post.ai ? "ai" : "real"), text: chip })
      ]),
      strip,
      total > 1 ? el("p", { class: "count" }, [cur, document.createTextNode(" of " + total + ", swipe for more")]) : null,
      el("div", { class: "body" }, [
        el("div", { class: "cap-block" }, [
          el("p", { class: "label", text: "Caption" }), caption, editor,
          el("p", { class: "cap-note", hidden: true }),
          el("div", { class: "cap-actions" }, [edit, copy, undo])
        ]),
        post.check ? el("div", { class: "checks" }, [el("p", { class: "label", text: "Check before it posts" }), el("p", { text: post.check })]) : null,
        post.note ? el("p", { class: "notice", text: post.note }) : null,
        decide,
        note
      ])
    ]);
  }

  function render() {
    posts = [];
    data.digests.forEach(function (d) {
      d.posts.forEach(function (post) { posts.push({ id: d.date + "/" + post.n, digest: d.date, sent: d.label, post: post }); });
    });
    // Drop saved taps for posts that are gone or that changed on the shop computer since the tap.
    var live = {};
    posts.forEach(function (p) { live[p.id] = p.post.rev; });
    Object.keys(state).forEach(function (id) { if (live[id] !== state[id].rev) delete state[id]; });
    put(STATE_STORE, state);

    var count = posts.length;
    var title = count === 0 ? "Nothing is waiting on you" : count === 1 ? "One post waiting for your yes" : count + " posts waiting for your yes";
    var lede = el("p", { class: "lede" });
    if (count) {
      lede.appendChild(el("strong", { text: data.posting ? "None of these has been posted." : "Nothing has been posted." }));
      lede.appendChild(document.createTextNode(" Tap yes, change or no on each one, then tap Send answers at the bottom. Tap Edit caption to fix the wording yourself."));
    } else {
      lede.textContent = "Every post has an answer. The next batch arrives Monday morning with a push.";
    }
    ui = { progress: el("span", { text: "" }) };
    var kids = [el("header", {}, [
      el("p", { class: "kicker", text: data.handle }),
      el("h1", { text: title }),
      lede,
      count ? el("div", { class: "progress", "aria-live": "polite" }, [el("span", { class: "dot" }), ui.progress]) : null
    ])];

    var week = null;
    posts.forEach(function (p) {
      if (p.post.week !== week) { week = p.post.week; kids.push(el("p", { class: "week", text: week })); }
      p.node = postCard(p, data.digests.length > 1);
      kids.push(p.node);
    });

    if (count) {
      ui.answers = el("pre", { id: "answers" });
      ui.send = el("button", { class: "primary", type: "button", text: "Send answers" });
      ui.send.addEventListener("click", send);
      ui.status = el("p", { class: "sent", "aria-live": "polite", hidden: true });
      ui.fallback = el("a", { class: "secondary", target: "_blank", rel: "noopener", hidden: true, text: "Send with a link" });
      var copyAll = el("button", { class: "secondary", type: "button", text: "Copy answers instead" });
      copyAll.addEventListener("click", function () { copyFrom(ui.answers, copyAll, "Copy answers instead", messageText()); });
      kids.push(el("section", { class: "panel" }, [
        el("h2", { text: "Your answers" }),
        el("p", { text: "Send answers goes straight to the shop computer. Yes approves the post. Change comes back to you as a new draft. No sets it aside. A caption you edit is saved the way you wrote it." + (data.posting ? "" : " Nothing goes on Instagram yet.") }),
        ui.answers,
        ui.send,
        ui.status,
        ui.fallback,
        el("p", { class: "small", text: "You can change an answer and send again any time before a post goes out." }),
        copyAll,
        el("p", { class: "small", text: "If no push comes, copy the answers and send them to Claude in the sign shop session." })
      ]));
    }

    if (data.approved.length) {
      var list = el("ol", { class: "list" });
      data.approved.forEach(function (a) {
        list.appendChild(el("li", {}, [document.createTextNode(a.title + " "), el("span", { text: a.when })]));
      });
      kids.push(el("section", { class: "panel" }, [
        el("h2", { text: "Approved" }),
        el("p", { text: data.posting ? "These go out at the times shown." : "These are approved and holding. Automatic posting is switched off, so nothing goes out." }),
        list
      ]));
    }
    if (data.needs.length) {
      var needs = el("ol", { class: "list" });
      data.needs.forEach(function (n) { needs.appendChild(el("li", { text: n })); });
      kids.push(el("section", { class: "panel" }, [el("h2", { text: "Also needed from you" }), needs]));
    }
    kids.push(el("p", { class: "foot", text: "Real photos are cropped only, never retouched. Tip cards are AI-made text graphics and show no job." }));
    app.replaceChildren.apply(app, kids);
    refresh();
  }

  function load() {
    lastLoad = Date.now();
    return unseal("d/index.bin?t=" + lastLoad, true).then(function (buf) {
      var text = new TextDecoder().decode(buf);
      if (fromLink) put(KEY_STORE, keyText);
      if (text === lastText) return;
      lastText = text;
      data = JSON.parse(text);
      render();
    }, function (err) {
      if (data) return;  // keep showing what we have
      if (err.message === "key") {
        if (!fromLink) drop(KEY_STORE);
        plain("This link is out of date", "Open the newest notification from the shop computer.");
      } else {
        plain("Could not load", "Check your signal, then pull down to reload.");
      }
    });
  }

  // Coming back to the page after a while picks up a new build, unless a note is being typed.
  document.addEventListener("visibilitychange", function () {
    var typing = document.activeElement && document.activeElement.tagName === "TEXTAREA";
    if (document.visibilityState === "visible" && !typing && Date.now() - lastLoad > 30000) load();
  });
  load();
})();
</script>
</body>
</html>
